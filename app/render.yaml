services:
  - type: web
    name: cem-culture-hub
    runtime: node
    rootDir: app
    buildCommand: "node -v"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DEFAULT_SIGNUP_ROLE
        value: user
      - key: ALLOW_SELF_PROVIDER_SIGNUP
        value: false
      - key: ALLOW_SELF_OPERATOR_SIGNUP
        value: false
      - key: REQUIRE_ADMIN_PROVIDER_APPROVAL
        value: true
      - key: REQUIRE_ADMIN_OPERATOR_APPROVAL
        value: true
      - key: ENABLE_SIMULATION_MODE
        value: true
      - key: ENABLE_USER_SUPPLIED_MODE
        value: true
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: REQUIRE_MEMBER_LOGIN
        value: true
      - key: ALLOW_DEV_LOGIN
        value: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
